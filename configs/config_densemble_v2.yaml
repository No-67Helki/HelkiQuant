# Robust v2: production-aligned inputs and raw-return labels.
#
# Differences from the legacy baseline:
# - No CSZScoreNorm: live single-stock inference cannot reproduce a daily
#   cross-sectional normalization without the full pool at inference time.
# - Raw labels: each layer predicts the absolute outcome used by the strategy,
#   instead of the stock's relative rank inside the training pool.
# - Stability-selected feature lists generated by evaluate_factors.py.

qlib_init:
  provider_uri:
    day: "../../data/cn_data_pool"
    1min: "../../data/cn_data_1min"
  dataset_cache:
  expression_cache:
  region: cn

qlib_init_inner:
  provider_uri:
    day: "../../data/cn_data_pool"
    1min: "../../data/cn_data_1min_pool"
  dataset_cache:
  expression_cache:
  region: cn

stock_id: "SZ301536"

data_handler_daily: &data_handler_daily
  start_time: 2022-01-04
  end_time: 2026-04-28
  fit_start_time: 2022-01-04
  fit_end_time: 2025-09-30
  instruments: all
  infer_processors:
    - class: RobustZScoreNorm
      kwargs:
        fields_group: feature
        clip_outlier: true
    - class: Fillna
      kwargs:
        fields_group: feature
  learn_processors:
    - class: DropnaLabel

data_handler_inner: &data_handler_inner
  start_time: 2022-01-04
  end_time: 2026-04-28
  fit_start_time: 2022-01-04
  fit_end_time: 2025-09-30
  instruments: pool80
  infer_processors:
    - class: RobustZScoreNorm
      kwargs:
        fields_group: feature
        clip_outlier: true
    - class: Fillna
      kwargs:
        fields_group: feature
  learn_processors:
    - class: DropnaLabel

segments: &segments
  train: [2022-01-04, 2024-12-31]
  valid: [2025-01-01, 2025-09-30]
  test: [2025-10-01, 2026-04-28]

strategy_params: &strategy_params
  outer_upper: 0.02
  outer_lower: -0.02
  middle_buy_thresh: 0.02
  middle_sell_thresh: -0.02
  inner_buy_thresh: 0.55
  inner_sell_thresh: 0.45
  trade_unit: 100
  position_pct: 0.30
  wave_buy_pct: 0.20
  wave_sell_pct: 0.30
  range_swing_pct: 0.10
  intraday_t_pct: 0.20
  max_position_pct: 0.70
  min_cash_reserve: 1000.0
  min_buy_lots: 1
  exit_on_bull_end: false

model_common: &model_common
  num_models: 4
  enable_sr: true
  enable_fs: true
  alpha1: 1.0
  alpha2: 1.0
  bins_sr: 6
  bins_fs: 4
  decay: 0.5
  sample_ratios: [0.8, 0.7, 0.6, 0.5]
  sub_weights: [1, 1, 1, 1]
  ensemble_eval_rows: 120000
  learning_rate: 0.035
  l2_leaf_reg: 8.0
  random_strength: 1.0
  subsample: 0.80
  max_depth: 5
  num_leaves: 32
  thread_count: 8
  grow_policy: Lossguide
  bootstrap_type: Bernoulli
  verbose: 50

outer_model:
  model:
    class: CatBoostDEnsemble
    module_path: catboost_densemble
    kwargs:
      <<: *model_common
      loss: MultiClass
      thresholds: [-0.08, 0.08]
      adaptive_thresholds: std_ratio
      learning_rate: 0.050
      l2_leaf_reg: 3.0
      random_strength: 1.0
      subsample: 0.85
      max_depth: 6
      num_leaves: 64
  fit_params:
    epochs: 220
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: Alpha158Macro
        module_path: alpha158_macro
        kwargs:
          <<: *data_handler_daily
          label: ["Ref($close, -21) / Ref($close, -1) - 1"]
          infer_processors:
            - class: RobustZScoreNorm
              kwargs: {fields_group: feature, clip_outlier: true}
            - class: Fillna
              kwargs: {fields_group: feature}
            - class: FeatureWhitelist
              module_path: feature_processors
              kwargs:
                fields_group: feature
                whitelist_path: factor_reports/feature_whitelist_outer_v2.json
      segments: *segments

middle_model:
  model:
    class: CatBoostDEnsemble
    module_path: catboost_densemble
    kwargs:
      <<: *model_common
      loss: MultiClass
      thresholds: [-0.02, 0.02]
      learning_rate: 0.025
      l2_leaf_reg: 14.0
      random_strength: 1.5
      subsample: 0.80
      max_depth: 6
      num_leaves: 64
  fit_params:
    epochs: 260
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: Alpha158HF
        module_path: handlers.alpha158_hf
        kwargs:
          <<: *data_handler_daily
          label: ["Ref($close, -6) / Ref($close, -1) - 1"]
          infer_processors:
            - class: RobustZScoreNorm
              kwargs: {fields_group: feature, clip_outlier: true}
            - class: Fillna
              kwargs: {fields_group: feature}
            - class: FeatureWhitelist
              module_path: feature_processors
              kwargs:
                fields_group: feature
                whitelist_path: factor_reports/feature_whitelist_middle_v2.json
      segments: *segments

inner_model:
  model:
    class: CatBoostDEnsemble
    module_path: catboost_densemble
    kwargs:
      <<: *model_common
      loss: Logloss
      # Round-trip costs are handled by strategy threshold tuning; use zero
      # here to preserve both long-T and reverse-T direction information.
      binary_threshold: 0.0
      learning_rate: 0.050
      l2_leaf_reg: 3.0
      random_strength: 1.0
      subsample: 0.85
      max_depth: 6
      num_leaves: 64
  fit_params:
    epochs: 220
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: Alpha158IntraReal
        module_path: alpha158_intra_real
        kwargs:
          <<: *data_handler_inner
          label: ["Ref($INTRADAY_T_RET_STABLE, -1)"]
          infer_processors:
            - class: RobustZScoreNorm
              kwargs: {fields_group: feature, clip_outlier: true}
            - class: Fillna
              kwargs: {fields_group: feature}
            - class: FeatureWhitelist
              module_path: feature_processors
              kwargs:
                fields_group: feature
                whitelist_path: factor_reports/feature_whitelist_inner_v2.json
      segments: *segments

strategy:
  class: MultiLayerStrategy
  module_path: multi_layer_strategy
  kwargs:
    <<: *strategy_params

executor:
  class: NestedExecutor
  module_path: qlib.backtest.executor
  kwargs:
    time_per_step: day
    inner_executor:
      class: SimulatorExecutor
      module_path: qlib.backtest.executor
      kwargs:
        time_per_step: 1min
        generate_portfolio_metrics: false
        verbose: false
        indicator_config:
          show_indicator: false
    inner_strategy:
      class: TWAPStrategy
      module_path: qlib.contrib.strategy.rule_strategy
    track_data: true
    generate_portfolio_metrics: true
    verbose: false
    indicator_config:
      show_indicator: true

backtest:
  start_time: 2026-01-05
  end_time: 2026-04-24
  account:
    cash: 500000
    SZ301536:
      amount: 2000
      price: 61.74
  benchmark: SZ301536
  exchange_kwargs:
    codes: ["SZ301536"]
    freq: 1min
    limit_threshold: 0.195
    deal_price: close
    open_cost: 0.0005
    close_cost: 0.0015
    min_cost: 5
    trade_unit: 100
