[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helkiquant"
version = "0.1.0"
description = "Production-oriented A-share quantitative research and execution system"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {file = "LICENSE"}
authors = [{name = "HelKi"}]
dependencies = [
  "catboost>=1.2,<2",
  "joblib>=1.3,<2",
  "numpy>=1.24,<2",
  "pandas>=1.5,<3",
  "PyYAML>=6,<7",
  "ruamel.yaml>=0.18,<0.19",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
research = ["pyqlib==0.9.7", "mlflow>=2.10,<4"]
dev = ["pytest>=8,<9"]

[project.scripts]
helki-rqdata-sync = "helki_quant.research.sync_rqdata_market_data:main"
helki-rqdata-audit = "helki_quant.research.audit_rqdata_data_quality:main"
helki-canonical-audit = "helki_quant.research.audit_canonical_market_data:main"
helki-live-readiness = "helki_quant.research.validate_strategy_live_readiness:main"
helki-build-provider = "helki_quant.research.qlib_provider_writer:main"
helki-refresh-canonical = "helki_quant.research.refresh_canonical_market_data:main"
helki-promote-frozen = "helki_quant.research.validate_frozen_strategy_promotion:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"helki_quant" = ["*.yaml"]
"helki_quant.research" = ["*.yaml", "configs/*.json", "configs/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src", "src/helki_quant", "src/helki_quant/research"]
testpaths = ["tests"]
addopts = "-ra"
